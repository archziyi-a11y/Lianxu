# Include these location blocks inside an existing, selected TLS virtual host.
# Replace 18765 with a verified free loopback port matching config.env.
# Preserve path and Authorization; FastMCP validates the upstream Host header.
location ^~ /mcp/ {
    client_max_body_size 36m;
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:18765;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 120s;
    access_log off;
}
location ^~ /phone/ {
    client_max_body_size 36m;
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:18765;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    access_log off;
}
